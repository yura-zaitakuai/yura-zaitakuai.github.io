<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>特典の受け取り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
  /* 凍結したら、下の a の href だけ現行アカウントのリンクに差し替える */
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff}
  body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{display:block;max-width:480px;margin:0 auto;padding:16px;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .card{display:block;overflow:hidden;border-radius:14px}
  .card img{display:block;width:100%;height:auto}
  .band{display:block;padding:9px 8px;background:#6B4A1E;color:#fff;font-size:min(4.4vw,19px);line-height:1.3;text-align:center;letter-spacing:.02em}
  .btn{position:relative;display:flex;align-items:center;gap:min(2.4vw,12px);margin-top:20px;padding:min(2.4vw,12px) min(3.2vw,16px);border:2px solid #05702B;border-radius:999px;
    background:linear-gradient(180deg,#4BE07F 0%,#17C95A 48%,#0BB84C 52%,#0AAE46 100%);
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.85),0 5px 0 #056A29,0 9px 14px rgba(0,0,0,.2)}
  .wrap:active .btn{transform:translateY(3px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.85),0 2px 0 #056A29,0 4px 8px rgba(0,0,0,.2)}
  .icon{flex:none;width:min(13.5vw,62px);height:min(13.5vw,62px)}
  .txt{flex:1;min-width:0;text-align:center;line-height:1.25}
  .txt span{display:block;white-space:nowrap}
  .sub{color:#fff;font-size:min(4.5vw,21px);text-shadow:0 1px 2px rgba(0,80,30,.7)}
  .main{margin-top:2px;color:#FFEE58;font-size:min(5vw,23px);text-shadow:0 2px 0 #056A29,0 0 3px rgba(0,80,30,.8)}
</style>
</head>
<body>
<a class="wrap" href="https://utage-system.com/line/open/DiKlWtTBWHQ1?mtid=nZevxLNrVytq">
  <span class="card">
    <img src="thumb.jpg" width="1000" height="563" alt="YouTube視聴者限定！キーワード特典＆公式LINE限定スペシャル企画のお受け取りはこちら">
    <span class="band">&#11015; 特典の受け取りは以下のボタンから &#11015;</span>
  </span>
  <span class="btn">
    <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="31" fill="#fff"/>
      <path fill="#06C755" d="M32 12c-12.700 0-23 8.300-23 18.600 0 9.200 8.200 16.900 19.200 18.300.8.200 1.800.500 2 1.200.2.600.1 1.500.1 2.100l-.3 2c-.1.600-.5 2.300 2 1.300s13.200-7.800 18-13.300c3.300-3.600 5-7.300 5-11.600C55 20.300 44.700 12 32 12z"/>
      <text x="32" y="35.500" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.500" font-weight="900" fill="#fff">LINE</text>
    </svg>
    <span class="txt">
      <span class="sub">特典の受け取り＆</span>
      <span class="main">公式LINE限定企画はこちら</span>
    </span>
  </span>
</a>
</body>
</html>
